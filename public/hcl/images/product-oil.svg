    <!-- Botanical etching on label -->
    
  <g transform="translate(0 5) rotate(0) scale(0.7)" stroke="#C9A45C" stroke-opacity="0.6" fill="none">
    <path d="M 0 120 Q 8 60 0 0 Q -8 -60 0 -120" stroke-width="2.5" stroke-linecap="round"/>
    
