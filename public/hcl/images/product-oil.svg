      <path d="M -8 -30 L -3.5 -28 L 0 -29 L 3.5 -28 L 8 -30 L 5 -36 L -5 -36 Z" fill="#C9A45C" fill-opacity="0.48"/>
      <circle cx="0" cy="-40" r="9" fill="#C9A45C" fill-opacity="0.51" stroke-width="1"/>
