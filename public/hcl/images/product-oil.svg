      <path d="M -9 -34 L -4 -32 L 0 -33 L 4 -32 L 9 -34 L 6 -40 L -6 -40 Z" fill="#C9A45C" fill-opacity="0.48"/>
      <circle cx="0" cy="-44" r="10" fill="#C9A45C" fill-opacity="0.51" stroke-width="1"/>
