  <text x="400" y="850" text-anchor="middle" fill="#C9A45C" font-family="Georgia, serif" font-size="14" font-weight="600" letter-spacing="1.5">TERNATE</text>
  <text x="400" y="885" text-anchor="middle" fill="#F6F0E4" fill-opacity="0.8" font-family="sans-serif" font-size="11" letter-spacing="1">Mount Gamalama Slopes</text>
