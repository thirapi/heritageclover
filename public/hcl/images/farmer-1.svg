      <path d="M -8 -30 L -3.5 -28 L 0 -29 L 3.5 -28 L 8 -30 L 5 -36 L -5 -36 Z" fill="#C9A45C" fill-opacity="0.27999999999999997"/>
      <circle cx="0" cy="-40" r="9" fill="#C9A45C" fill-opacity="0.2975" stroke-width="1"/>
    </g>

    <g transform="translate(0, -175)">
