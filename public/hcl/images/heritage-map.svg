<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="mapBg" cx="70%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F6F0E4"/>
      <stop offset="80%" stop-color="#EFE6D3"/>
      <stop offset="100%" stop-color="#E4D9C6"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#mapBg)"/>
  
    <!-- East Java Volcanic Highlands & Clove Groves Map -->
    <!-- Grid graticule -->
    <g stroke="#C9A45C" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4,6">
      <line x1="100" y1="150" x2="1500" y2="150"/>
      <line x1="100" y1="350" x2="1500" y2="350"/>
      <line x1="100" y1="550" x2="1500" y2="550"/>
      <line x1="100" y1="750" x2="1500" y2="750"/>
      <line x1="300" y1="80" x2="300" y2="820"/>
      <line x1="600" y1="80" x2="600" y2="820"/>
      <line x1="900" y1="80" x2="900" y2="820"/>
      <line x1="1200" y1="80" x2="1200" y2="820"/>
    </g>

    <!-- East Java Mainland Silhouette -->
    <!-- West border (Pacitan/Tuban) -> North coast (Surabaya) -> East horn (Banyuwangi) -> South rugged coast -->
    <g fill="#2E1A13" fill-opacity="0.22" stroke="#C9A45C" stroke-width="1.8" stroke-opacity="0.55">
      <path d="M 520 280 
               C 620 270, 750 290, 860 300 
               C 920 320, 970 300, 1020 330 
               C 1070 340, 1140 330, 1220 360 
               C 1270 380, 1340 430, 1370 480 
               C 1390 530, 1350 580, 1310 610 
               C 1240 610, 1160 590, 1100 620 
               C 1020 630, 950 640, 880 620 
               C 800 640, 720 630, 650 610 
               C 580 620, 520 630, 480 600 
               C 450 550, 460 480, 480 420 
               C 490 360, 480 320, 520 280 Z"/>
    </g>

    <!-- Madura Island (North of Surabaya) -->
    <g fill="#2E1A13" fill-opacity="0.18" stroke="#C9A45C" stroke-width="1.2" stroke-opacity="0.45">
      <path d="M 870 250 C 960 230, 1080 235, 1170 260 C 1190 280, 1140 300, 1070 300 C 970 300, 900 290, 870 250 Z"/>
      <text x="1000" y="275" fill="#9E7E3C" font-family="Georgia, serif" font-size="12" letter-spacing="2">MADURA</text>
    </g>

    <!-- Mount Semeru (Volcanic peak 3,676m - East Java) -->
    <g transform="translate(940, 530)">
      <circle cx="0" cy="0" r="34" fill="#AD4F2B" fill-opacity="0.32" stroke="#C9A45C" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#C9A45C" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="0" cy="0" r="4" fill="#C9A45C"/>
      <text x="44" y="-8" fill="#C9A45C" font-family="Georgia, serif" font-size="15" font-weight="600" letter-spacing="1">MT. SEMERU</text>
      <text x="44" y="8" fill="#4A2C21" font-family="sans-serif" font-size="10" letter-spacing="1">Volcanic Terroir (3,676m)</text>
    </g>

    <!-- Trenggalek / Watulimo Clove Hills -->
    <g transform="translate(680, 550)">
      <circle cx="0" cy="0" r="28" fill="#3F5B3A" fill-opacity="0.3" stroke="#C9A45C" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#C9A45C"/>
      <text x="-40" y="-36" fill="#C9A45C" font-family="Georgia, serif" font-size="14" font-weight="600" letter-spacing="1">TRENGGALEK</text>
      <text x="-40" y="-22" fill="#4A2C21" font-family="sans-serif" font-size="10" letter-spacing="1">Watulimo Heirloom Groves</text>
    </g>

    <!-- Pacitan Clove Valley -->
    <g transform="translate(540, 560)">
      <circle cx="0" cy="0" r="22" fill="#AD4F2B" fill-opacity="0.25" stroke="#C9A45C" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3" fill="#C9A45C"/>
      <text x="-80" y="24" fill="#C9A45C" font-family="Georgia, serif" font-size="13" font-weight="600" letter-spacing="1">PACITAN</text>
      <text x="-80" y="36" fill="#4A2C21" font-family="sans-serif" font-size="9" letter-spacing="1">South Coast Valleys</text>
    </g>

    <!-- Malang Plateau & Dampit -->
    <g transform="translate(860, 480)">
      <circle cx="0" cy="0" r="20" fill="#3F5B3A" fill-opacity="0.25" stroke="#C9A45C" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3" fill="#C9A45C"/>
      <text x="-30" y="-26" fill="#C9A45C" font-family="Georgia, serif" font-size="13" font-weight="600" letter-spacing="1">MALANG · DAMPIT</text>
    </g>

    <!-- Sea wave ripples (Southern Ocean / Samudra Hindia) -->
    <g stroke="#C9A45C" stroke-opacity="0.2" stroke-width="1" fill="none">
      <path d="M 420 690 Q 450 680 480 690 T 540 690 T 600 690"/>
      <path d="M 720 710 Q 750 700 780 710 T 840 710 T 900 710"/>
      <path d="M 1020 680 Q 1050 670 1080 680 T 1140 680 T 1200 680"/>
      <text x="760" y="750" fill="#9E7E3C" font-family="Georgia, serif" font-size="13" font-style="italic" letter-spacing="3">OCEANUS INDICUS</text>
    </g>

    <!-- Historic merchant galleon silhouette -->
    <g transform="translate(360, 380) scale(0.7)" stroke="#C9A45C" stroke-width="1.5" fill="#C9A45C" fill-opacity="0.2">
      <!-- Hull -->
      <path d="M 0 60 C 30 70, 90 70, 120 50 L 100 35 L 20 35 Z"/>
      <!-- Masts -->
      <line x1="40" y1="35" x2="40" y2="-20" stroke-width="2"/>
      <line x1="75" y1="35" x2="75" y2="-35" stroke-width="2"/>
      <line x1="105" y1="35" x2="105" y2="-15" stroke-width="2"/>
      <!-- Square sails -->
      <path d="M 25 30 Q 40 22 55 30 L 52 5 Q 40 -2 28 5 Z" fill-opacity="0.4"/>
      <path d="M 60 25 Q 75 16 90 25 L 87 -10 Q 75 -18 63 -10 Z" fill-opacity="0.4"/>
      <path d="M 95 30 Q 105 24 115 30 L 112 10 Q 105 5 98 10 Z" fill-opacity="0.4"/>
    </g>

    <!-- Chart cartouche label -->
    <g transform="translate(140, 110)">
      <rect x="0" y="0" width="370" height="98" rx="4" fill="#EFE6D3" fill-opacity="0.88" stroke="#C9A45C" stroke-width="1.2"/>
      <text x="20" y="32" fill="#2E1A13" font-family="Georgia, serif" font-size="16" font-weight="600" letter-spacing="1.5">TABULA JAVAE ORIENTALIS</text>
      <text x="20" y="52" fill="#AD4F2B" font-family="Georgia, serif" font-size="12" font-style="italic">The Volcanic Highlands &amp; Heirloom Clove Groves</text>
      <text x="20" y="74" fill="#4A2C21" font-family="sans-serif" font-size="11" letter-spacing="1">8° 03' S, 111° 42' E · JAVA ORIENTALIS</text>
    </g>
  
  
