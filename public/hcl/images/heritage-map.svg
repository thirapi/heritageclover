    <circle cx="1132" cy="540" r="16" fill="#AD4F2B" fill-opacity="0.25" stroke="#C9A45C" stroke-width="1"/>
    <text x="1156" y="545" fill="#9E7E3C" font-family="Georgia, serif" font-size="12">Makian</text>

