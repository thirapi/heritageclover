      <polygon points="480,520 480,620 487.6536686473018,538.4775906502257" fill="#C9A45C" fill-opacity="0.405"/>
      <polygon points="480,520 480,620 472.3463313526982,538.4775906502257" fill="#C9A45C" fill-opacity="0.18000000000000002"/>
    
      <polygon points="480,520 434.03805922287444,565.9619407771256 472.3463313526982,538.4775906502257" fill="#C9A45C" fill-opacity="0.27"/>
