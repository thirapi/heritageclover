<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="uBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#873B1D"/>
      <stop offset="100%" stop-color="#2E1A13"/>
    </linearGradient>
  </defs>

  <rect width="900" height="900" fill="url(#uBg)"/>
  <rect x="18" y="18" width="864" height="864" rx="8" fill="none" stroke="#C9A45C" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(450, 405)">
    
      <g stroke="#C9A45C" stroke-width="1.5" fill="#C9A45C" fill-opacity="0.2">
        <path d="M -60 20 Q 0 80 60 20 L 50 -10 L -50 -10 Z"/>
        <line x1="-65" y1="-10" x2="65" y2="-10" stroke-width="2"/>
        <!-- Steam swirls with clove buds -->
        <path d="M -20 -20 Q -30 -50 -15 -70 Q 0 -90 -10 -110" fill="none" stroke-opacity="0.6"/>
        <path d="M 15 -20 Q 5 -50 20 -70 Q 35 -90 25 -110" fill="none" stroke-opacity="0.6"/>
        
  <g transform="translate(0 -45) rotate(15) scale(0.5)" stroke="#C9A45C" stroke-opacity="0.8" fill="#C9A45C" fill-opacity="0.27999999999999997">
    <!-- Tapering calyx tube / hypanthium with fine longitudinal ribs -->
    <path d="M -7 40 L -5 -20 L 5 -20 L 7 40 C 4 44 -4 44 -7 40 Z" stroke-width="1.5"/>
    <line x1="-2" y1="-18" x2="-3" y2="38" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="2" y1="-18" x2="3" y2="38" stroke-width="1" stroke-opacity="0.4"/>
    <!-- 4 triangular sepals spreading outward -->
    <path d="M -16 -28 L -6 -20 L -2 -22 L 2 -22 L 6 -20 L 16 -28 L 12 -36 L 5 -30 L -5 -30 L -12 -36 Z" stroke-width="1.5" fill-opacity="0.5599999999999999"/>
    <!-- Round unopened bud dome (four tightly folded petals) -->
    <circle cx="0" cy="-40" r="14" stroke-width="1.5" fill-opacity="0.6400000000000001"/>
    <path d="M -9 -42 C -4 -49 4 -49 9 -42" stroke-width="1" fill="none" stroke-opacity="0.48"/>
    <path d="M -11 -38 C -4 -32 4 -32 11 -38" stroke-width="1" fill="none" stroke-opacity="0.48"/>
  </g>
      </g>
    
  </g>

  <!-- Editorial label -->
  <text x="450" y="702" text-anchor="middle" fill="#F6F0E4" font-family="Georgia, serif" font-size="22" font-weight="600" letter-spacing="1">Culinary</text>
  <text x="450" y="765" text-anchor="middle" fill="#C9A45C" font-family="sans-serif" font-size="12" letter-spacing="1.5">TRADITIONAL COOKING &amp; BAKING</text>
</svg>